; supervisord stays root only to start the programs; each runs as www-data,
; so a flaw in any dependency does not get root over the data volume.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

[program:http]
user=www-data
environment=HOME="/tmp"
command=frankenphp run --config /etc/caddy/Caddyfile
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue]
; --memory below PHP's memory_limit (256M): the worker restarts between jobs
; before one of them runs into the hard limit.
user=www-data
environment=HOME="/tmp"
command=php /app/artisan queue:work --tries=3 --sleep=3 --max-time=3600 --memory=192
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
user=www-data
environment=HOME="/tmp"
command=php /app/artisan schedule:work
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
