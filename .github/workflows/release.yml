# release-please keeps a Release PR open with the next version and the
# changelog; merging it tags the release, and this workflow then publishes
# the image for it. The token is a fine-grained one of this repository
# (contents and pull requests: write): a PR opened with the built-in token
# would never run CI, so it could never be merged.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  image:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    # As for `edge`: the arm64 base layers may have to be compiled anew.
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release-please.outputs.version }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # Image names must be lower case and the owner is not.
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Pulling a private package needs a login; it is harmless for a public one.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The release must start and must take over the previous release's
      # data before anyone is offered it.
      - name: Image to try
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/Dockerfile
          load: true
          tags: videtrack:release
          build-args: APP_VERSION=${{ env.VERSION }}
          cache-from: type=gha,scope=prod

      # The upgrade is skipped only for the first release; after that a
      # failed pull of the previous one fails the release.
      - name: Fresh start and upgrade
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          scripts/smoke.sh videtrack:release
          earlier=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --json tagName \
            --jq "[.[] | select(.tagName != \"v$VERSION\")] | length")
          if [ "$earlier" = 0 ]; then
            echo "First release: nothing to upgrade from."
            exit 0
          fi
          docker pull "$IMAGE:latest"
          scripts/smoke.sh videtrack:release "$IMAGE:latest"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ env.VERSION }}
            ${{ steps.image.outputs.name }}:${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          build-args: APP_VERSION=${{ env.VERSION }}
          cache-from: type=gha,scope=prod
          cache-to: type=gha,scope=prod,mode=max
