# The one gate of this repository, `composer check`, run in the same dev
# image as locally; then the production image is started for real. A commit
# on main that passed everything becomes the `edge` image.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Dev image
        uses: docker/build-push-action@v7
        with:
          context: docker/dev
          load: true
          tags: videtrack-dev
          cache-from: type=gha,scope=dev
          cache-to: type=gha,scope=dev,mode=max

      - name: Gates
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/app" -w /app videtrack-dev sh -c '
            composer install --no-interaction --prefer-dist --no-progress &&
            npm ci --no-audit --no-fund &&
            cp .env.example .env &&
            php artisan key:generate &&
            composer check'

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Composer advisories
        run: composer audit --locked

      - name: npm advisories (what ships)
        run: npm audit --omit=dev --audit-level=high

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # On a pull request the scan lists the PR's commits through the API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Pulling a private package needs a login; it is harmless for a public one.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/prod/Dockerfile
          load: true
          tags: videtrack:ci
          build-args: APP_VERSION=ci-${{ github.sha }}
          cache-from: type=gha,scope=prod
          cache-to: type=gha,scope=prod,mode=max

      - name: Fresh start
        run: scripts/smoke.sh videtrack:ci

      # What an upgrade meets: the latest release's database, then this image.
      # Skipped only when no release exists; once one does, a failed pull fails.
      - name: Upgrade from the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName --jq length)" = 0 ]; then
            echo "No release yet: nothing to upgrade from."
            exit 0
          fi
          previous="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker pull "$previous"
          scripts/smoke.sh videtrack:ci "$previous"

  edge:
    needs: [check, audit, gitleaks, smoke]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # arm64 is built under emulation: once the base layers are cached a build
    # takes minutes, but the first one, or one after a new base image,
    # compiles the PHP extensions and needs the room.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=edge,branch=main
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/prod/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=edge-${{ github.sha }}
          cache-from: type=gha,scope=prod
          cache-to: type=gha,scope=prod,mode=max
