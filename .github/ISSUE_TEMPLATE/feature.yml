name: Feature
description: An idea for something VideTrack does not do yet.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The situation and what is missing today, before any solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
